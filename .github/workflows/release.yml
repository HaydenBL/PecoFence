name: Release

# A push to master releases the Cargo.toml version when it has no release yet; bump the
# version to ship a merge.
on:
  push:
    tags: ['v*']
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cne $tag) { throw "Tag must match Cargo.toml version" }
          } else {
            gh release view $tag --json tagName 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              "$tag is already released; bump the version in Cargo.toml to release this push."
              "skip=true" >> $env:GITHUB_OUTPUT
            }
            $global:LASTEXITCODE = 0
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.skip != 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.version.outputs.skip != 'true'
        with:
          python-version: '3.12'
      - name: Verify
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-locales.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-readme-translations.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned Inno Setup compiler
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: ./scripts/setup-inno-ci.ps1
      - name: Package
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          PACKAGE_REPOSITORY: ${{ github.repository }}
        run: ./scripts/make-windows.ps1 -Repository $env:PACKAGE_REPOSITORY
      - name: Package and installer smoke tests
        if: steps.version.outputs.skip != 'true'
        env:
          PACKAGE_REPOSITORY: ${{ github.repository }}
        run: python scripts/test-windows-packaging.py --repository "$env:PACKAGE_REPOSITORY"
      - name: Publish GitHub Release
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $base = "dist/pecofence-$env:TAG-x64"
          $assets = @("$base-portable.zip", "$base-portable.zip.sha256", "$base-setup.exe", "$base-setup.exe.sha256")
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset: $asset" }
          }
          # A master push creates the tag at the commit it built.
          $target = if ($env:GITHUB_REF_TYPE -eq 'tag') { @('--verify-tag') } else { @('--target', $env:GITHUB_SHA) }
          gh release create $env:TAG @assets @target --generate-notes --title "PecoFence $env:TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
